[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "face-anonymization-pipeline"
version = "0.1.0"
description = "Face masking with detected face coordinates and YOLO pose fallback"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ultralytics>=8.3",
    "opencv-python>=4.8",
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
test = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]
